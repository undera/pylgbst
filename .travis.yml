dist: focal
branches:
  only:
    - master
    - /(\d+\.?)+/
language: python
python: 3.8
install:
  - pip install codecov codacy-coverage pytest bleak

env:
  - READTHEDOCS=True

script:
  - coverage run --omit="examples/*" --source=. -m pytest -v --ignore=examples --log-level=INFO tests

after_success:
  - coverage report -m
  - coverage xml
  - codecov
  - python-codacy-coverage -r coverage.xml

deploy:
  edge: true  # use latest v2 deploy
  provider: pypi
  #  skip_cleanup: true
  on:
    tags: true
